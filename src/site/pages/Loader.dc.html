body{margin:0;background:transparent}
.ld{box-sizing:border-box;width:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 24px;background:radial-gradient(120% 90% at 50% 38%,#FFFFFF 0%,#F4F2F8 48%,#ECEEF3 100%);border-radius:10px;font-family:'PP Neue Montreal','Neue Montreal','Helvetica Neue',Helvetica,Arial,sans-serif;color:#1F1F1F}
.ld-stage{position:relative;width:132px;height:132px}
.ld-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ld-spin{transform-box:view-box;transform-origin:60px 60px;animation:ld-turn 6.4s cubic-bezier(.65,0,.35,1) infinite}
.ld-pop{transform-box:view-box;transform-origin:60px 62px;animation:ld-squash 1.6s cubic-bezier(.3,1.6,.5,1) infinite}

.ld-shadow{position:absolute;left:50%;bottom:-6px;width:64px;height:8px;margin-left:-32px;border-radius:50%;background:rgba(60,50,80,.12);filter:blur(3px);animation:ld-sh 1.6s cubic-bezier(.3,1.6,.5,1) infinite}

.ld-done .ld-spin,.ld-done .ld-pop,.ld-done .ld-shadow{animation:none}
.ld-done .ld-pop{animation:ld-land .7s cubic-bezier(.3,1.7,.5,1) both}
@keyframes ld-land{0%{transform:scale(.8)}100%{transform:scale(1)}}
.ld-label{min-height:22px;font-size:15px;line-height:22px;color:#6E6A66;text-align:center}
.ld-bar{width:min(220px,70%);height:3px;border-radius:99px;background:rgba(31,31,31,.08);overflow:hidden}
.ld-bar i{display:block;height:100%;border-radius:99px;background:#1F1F1F;transition:width .25s linear}
.ld-btn{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(31,31,31,.06);font:inherit;font-size:15px;line-height:22px;color:#1F1F1F;cursor:pointer;transition:background .25s ease}
.ld-btn:hover{background:#FFFFFF}
.ld-btn:focus-visible{outline:2px solid #3F6C9B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ld-spin,.ld-pop,.ld-shadow{animation:none}}
