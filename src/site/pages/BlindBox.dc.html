<!doctype html>
<html lang="en">

<title>Blind box — live prototype</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400&amp;display=swap">
<style>
body{margin:0;background:transparent}
.bb-3d{transform-style:preserve-3d}
.bb-f{position:absolute;left:50%;top:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box}
@keyframes bb-turn{0%,100%{transform:rotateX(-24deg) rotateY(-40deg)}50%{transform:rotateX(-20deg) rotateY(-24deg)}}
@keyframes bb-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bb-jiggle{0%,100%{transform:rotateZ(0) translateY(0)}20%{transform:rotateZ(-3deg) translateY(-3px)}45%{transform:rotateZ(2.5deg)}70%{transform:rotateZ(-1.5deg)}}
@keyframes bb-sway{0%,100%{transform:rotateX(8deg) rotateY(-14deg) rotateZ(-1.5deg)}50%{transform:rotateX(4deg) rotateY(14deg) rotateZ(1.5deg)}}
@keyframes bb-sheen{0%{transform:translateX(-140%) skewX(-16deg)}55%,100%{transform:translateX(260%) skewX(-16deg)}}
@keyframes bb-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes bb-ring{0%{box-shadow:0 3px 10px rgba(31,31,31,.22),0 0 0 0 rgba(63,108,155,.45)}100%{box-shadow:0 3px 10px rgba(31,31,31,.22),0 0 0 13px rgba(63,108,155,0)}}
@keyframes bb-conf{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.5);opacity:0}}
@keyframes bb-glow{0%{transform:scale(.25);opacity:.95}100%{transform:scale(2);opacity:0}}
@keyframes bb-spin{0%{transform:translateY(70px) rotateY(-540deg) scale(.15)}62%{transform:translateY(-14px) rotateY(18deg) scale(1.1)}82%{transform:translateY(3px) rotateY(-6deg) scale(.97)}100%{transform:translateY(0) rotateY(0) scale(1)}}
@keyframes bb-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes bb-shimmer{0%{filter:hue-rotate(0deg) saturate(1.15)}100%{filter:hue-rotate(360deg) saturate(1.15)}}
@keyframes bb-twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.bb-turn{animation:bb-turn 6s ease-in-out infinite}
.bb-hover{animation:bb-hover 3.2s ease-in-out infinite}
.bb-hit:hover~.bb-scene .bb-jig,.bb-hit:focus-visible~.bb-scene .bb-jig{animation:bb-jiggle .7s ease-in-out}
.bb-hit:focus-visible{outline:2px solid #3F6C9B;outline-offset:4px;border-radius:16px}
.bb-sway{animation:bb-sway 4.4s ease-in-out infinite}
.bb-sheen{animation:bb-sheen 3.8s ease-in-out infinite}
.bb-handle{animation:bb-ring 1.6s ease-out infinite}
.bb-handle:focus-visible{outline:2px solid #3F6C9B;outline-offset:3px}
.bb-hint-arrow{display:inline-block;animation:bb-nudge 1.2s ease-in-out infinite}
.bb-spin{animation:bb-spin 1.05s cubic-bezier(.2,.7,.25,1) both}
.bb-float{animation:bb-float 3s ease-in-out infinite}
.bb-conf{animation:bb-conf 1s cubic-bezier(.15,.7,.3,1) both}
.bb-glow{animation:bb-glow .9s cubic-bezier(.2,.7,.3,1) both}
.bb-secret{animation:bb-shimmer 4.5s linear infinite}
.bb-tw{animation:bb-twinkle 1.7s ease-in-out infinite}
.bb-again{transition:transform .25s cubic-bezier(.23,1,.32,1),box-shadow .25s ease}
.bb-again:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,31,31,.18)}
.bb-again:active{transform:translateY(0) scale(.98)}
@media (prefers-reduced-motion:reduce){.bb-turn,.bb-hover,.bb-sway,.bb-sheen,.bb-handle,.bb-hint-arrow,.bb-float,.bb-secret,.bb-tw{animation:none}.bb-spin{animation:none}.bb-conf,.bb-glow{display:none}}
</style>
</helmet>
