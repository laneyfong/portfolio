<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laney Fong — Lab</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#6E6A66;text-decoration:none}a:hover{color:#1F1F1F}
.lf-side{position:sticky;top:80px}
.lf-rv{animation:lf-rv .8s cubic-bezier(.23,1,.32,1) both}
@keyframes lf-rv{from{opacity:0;filter:blur(10px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.lf-tile{transition:transform .4s cubic-bezier(.23,1,.32,1)}
.lf-tile img{transition:transform .6s cubic-bezier(.23,1,.32,1),filter .6s ease}
.lf-tile:hover{transform:translateY(-3px)}
.lf-tile:active{transform:translateY(-1px) scale(.996)}
.lf-tile:hover img{transform:scale(1.03)}
.lf-tile .lf-cap{transition:color .3s ease}
.lf-tile:hover .lf-cap{color:#1F1F1F}
nav a span{transition:border-color .3s ease,border-bottom-style .01s}
nav a:hover span{border-bottom-style:solid;border-bottom-color:#1F1F1F}
.lf-btn{transition:transform .25s cubic-bezier(.23,1,.32,1),box-shadow .25s ease,background-color .25s ease}
.lf-btn:hover{transform:scale(1.07);box-shadow:0 10px 30px rgba(31,31,31,.2)}
.lf-btn:active{transform:scale(.93)}
.lf-seg{transition:background-color .3s cubic-bezier(.23,1,.32,1),color .3s ease,box-shadow .3s ease}
.lf-cta{transition:transform .3s cubic-bezier(.23,1,.32,1),box-shadow .3s ease}
.lf-cta:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(31,31,31,.22)}
.lf-cta:active{transform:translateY(0) scale(.98)}
.lf-cta svg{transition:transform .3s cubic-bezier(.23,1,.32,1)}
.lf-cta:hover svg{transform:translateX(4px)}
@keyframes lf-wipe{from{opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(20px) scale(1.04)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes lf-prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lf-hero{from{transform:scale(1.05) translateY(0)}to{transform:scale(1.05) translateY(5%)}}
@supports (animation-timeline: view()){
.lf-wipe{animation:lf-wipe 1.1s cubic-bezier(.23,1,.32,1) both;animation-timeline:view();animation-range:entry 0% entry 92%}
.lf-prog{animation:lf-prog linear both;animation-timeline:scroll(nearest);transform-origin:0 50%}
.lf-hero{animation:lf-hero linear both;animation-timeline:scroll(nearest);animation-range:0 70vh}
}
.lf-chatwrap{position:sticky;top:80px}
.lf-bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 18px;align-items:stretch}
.lf-bento .lf-wipe{position:relative;border:1px solid rgba(31,31,31,.06) !important;border-radius:6px !important;background:#F3F3F1 !important;box-shadow:none}
.lf-bento .lf-wipe>img,.lf-bento .lf-wipe>video{border-radius:6px}
.lf-box{box-sizing:border-box;padding:0;background:none}
@media (max-width:700px){.lf-bento{grid-template-columns:minmax(0,1fr)}.lf-bento>*{grid-column:auto !important}}
@media (max-width:660px){.lf-dock-sp{display:none}}
@media (max-width:820px){.lf-side{position:static}.lf-chatwrap{position:relative;top:0}}
@keyframes lf-sr{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes lf-sr-img{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.lf-sr{animation:lf-sr .9s cubic-bezier(.23,1,.32,1) both;animation-timeline:view();animation-range:entry 0% entry 85%}
.lf-sr-img{animation:lf-sr-img 1s cubic-bezier(.23,1,.32,1) both;animation-timeline:view();animation-range:entry 0% entry 90%}
}
@keyframes lf-pop-l{from{opacity:0;transform:translateY(30px) scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes lf-pop-r{from{opacity:0;transform:translateY(30px) scale(.7) rotate(6deg)}to{opacity:1;transform:none}}
.lf-pop{animation:lf-pop-l .5s cubic-bezier(.22,1.08,.3,1) backwards;transform-origin:50% 160%;transition:transform .25s cubic-bezier(.23,1,.32,1),box-shadow .25s ease}
.lf-pop:nth-child(even){animation-name:lf-pop-r}
.lf-pop:nth-child(1){animation-delay:0.02s}.lf-pop:nth-child(2){animation-delay:0.07s}.lf-pop:nth-child(3){animation-delay:0.11s}.lf-pop:nth-child(4){animation-delay:0.15s}.lf-pop:nth-child(5){animation-delay:0.20s}.lf-pop:nth-child(6){animation-delay:0.24s}.lf-pop:nth-child(7){animation-delay:0.29s}.lf-pop:nth-child(8){animation-delay:0.34s}.lf-pop:nth-child(9){animation-delay:0.38s}.lf-pop:nth-child(10){animation-delay:0.42s}.lf-pop:nth-child(11){animation-delay:0.47s}.lf-pop:nth-child(12){animation-delay:0.52s}
.lf-pop:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(31,31,31,.16)}
.lf-pop:active{transform:translateY(-1px) scale(.98)}
@media (prefers-reduced-motion:reduce){.lf-rv{animation:none}.lf-pop{animation:none}.lf-sr,.lf-sr-img,.lf-wipe,.lf-hero{animation:none !important}.lf-tile:hover,.lf-cta:hover,.lf-btn:hover{transform:none}.lf-sheet{transition:none !important}.lf-tile img{transition:none}}
@media (min-width:1100px){.lf-page{display:grid !important;max-width:1280px !important;grid-template-columns:152px minmax(0,700px) 152px;justify-content:center;column-gap:48px !important}.lf-page>main{max-width:none !important}}
@media (min-width:1100px){.lf-dockrow{display:grid !important;max-width:1280px !important;grid-template-columns:152px minmax(0,700px) 152px;justify-content:center;column-gap:48px !important}.lf-dockrow>div:last-child{max-width:none !important}}
@media (min-width:821px){.lf-side{height:calc(100vh - 106px);min-height:300px;box-sizing:border-box;z-index:12}}
.lf-sbsig{display:block;height:46px;width:auto;margin:0 0 4px 0;transform:rotate(30deg);transform-origin:center;opacity:.9;pointer-events:none;user-select:none}
.lf-ic{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:#8C8782;transition:color .2s ease,background-color .2s ease}
.lf-ic:hover,.lf-ic:focus-visible{color:#1F1F1F;background:#F3F2F0}
.lf-ic::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,3px);padding:3px 7px;border-radius:6px;background:#1F1F1F;color:#fff;font-size:12px;line-height:16px;letter-spacing:0;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .22s cubic-bezier(.23,1,.32,1)}
.lf-ic:hover::after,.lf-ic:focus-visible::after{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.lf-ic,.lf-ic::after{transition:none}}
@media (max-width:820px){.lf-page{justify-content:flex-start !important}}

/* Mobile: compact sticky top bar instead of the stacked sidebar list. */
@media (max-width:820px){
.lf-side{position:sticky !important;top:0;z-index:20;flex:1 1 100% !important;flex-direction:row !important;flex-wrap:wrap !important;align-items:center !important;justify-content:space-between !important;gap:6px 16px !important;height:auto !important;min-height:0 !important;margin:-80px calc(-1 * clamp(20px, 5vw, 80px)) 0;padding:14px clamp(20px, 5vw, 80px) 4px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(31,31,31,.07)}
.lf-side>div:first-child,.lf-side>.lf-sb{display:contents !important}
.lf-side>div:first-child>a{order:1}
.lf-side .lf-sbsig{display:none !important}
.lf-side nav[aria-label="Contact"]{order:2;margin:0 -7px 0 0 !important}
.lf-side nav[aria-label="Primary"]{order:3;flex:1 1 100%;flex-direction:row !important;align-items:center !important;gap:22px;font-size:15px !important}
.lf-side nav[aria-label="Primary"] a{padding:10px 0 !important}
}
</style>
</helmet>
<div style="position: relative; background: #ffffff; color: #1F1F1F; font-family: 'PP Neue Montreal', 'Neue Montreal', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; letter-spacing: -0.02em">

<div class="lf-page" style="box-sizing: border-box; max-width: 1180px; margin: 0 auto; padding: 80px clamp(20px, 5vw, 80px) 120px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; column-gap: 56px; row-gap: 32px">

<header class="lf-side" style="flex: 0 0 152px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 20px">
<a href="/" style="font-family: 'Averia Serif Libre', Georgia, serif; font-weight: 300; font-size: 22px; line-height: 21px; letter-spacing: -0.5px; color: #1F1F1F">Laney Fong</a>
<nav aria-label="Primary" style="display: flex; flex-direction: column; align-items: flex-start; font-size: 15px; line-height: 22px">
<a href="/" style="display: block; padding: 4px 0"><span style="border-bottom: 1px dotted #A8A39D">Index</span></a>
<a href="/about" style="display: block; padding: 4px 0"><span style="border-bottom: 1px dotted #A8A39D">About</span></a>
<a href="/lab" aria-current="page" style="display: block; padding: 4px 0; color: #1F1F1F"><span style="border-bottom: 1px solid #1F1F1F">Lab</span></a>
<a href="/resume" style="display: block; padding: 4px 0"><span style="border-bottom: 1px dotted #A8A39D">Resume</span></a>
</nav>
</div>

<div class="lf-sb" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
<img class="lf-sbsig" src="/media/sig.webp" alt="Laney’s signature" draggable="false">
<nav aria-label="Contact" style="display: flex; align-items: center; gap: 4px; margin-left: -7px">
<a href="mailto:laneyrfong@gmail.com" class="lf-ic" aria-label="Email" data-tip="Email"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="2"></rect><path d="M3.5 5.5l6.5 5 6.5-5" stroke-linecap="round"></path></svg></a>
<a href="https://www.linkedin.com/in/laneyfong/" class="lf-ic" aria-label="LinkedIn" data-tip="LinkedIn"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="2.5" width="15" height="15" rx="3.5"></rect><path d="M6.5 9v5M6.5 6.4v.1" stroke-linecap="round"></path><path d="M9.5 14V9m0 2.4c0-1.4.9-2.5 2.2-2.5s2 .9 2 2.4V14" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<a href="https://x.com/laneyuxui" class="lf-ic" aria-label="X" data-tip="X"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3.5 3.5h3.6l9.4 13h-3.6z" stroke-linejoin="round"></path><path d="M16 3.5l-5.3 5.9M9.3 10.6 4 16.5"></path></svg></a>
</nav>
</div>
</header>

<main style="flex: 1 1 400px; min-width: 0; max-width: 700px; display: flex; flex-direction: column; gap: 28px">

<section class="lf-rv" style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px">

<h1 style="margin: 0; max-width: 620px; font-weight: 400; font-size: clamp(20px, 2.1vw, 24px); line-height: 1.3; letter-spacing: -0.025em; color: #1F1F1F">Experiments in motion, interaction and accessibility — <span style="color: #6E6A66">small things I build to find out how they should feel.</span></h1>
</section>

<section class="lf-rv" aria-label="Experiments" style="display: flex; flex-direction: column; gap: 28px; padding-top: 12px; animation-delay: 0.08s">

<div class="lf-bento">
<sc-for list="{{ experiments }}" as="e" hint-placeholder-count="3">
<sc-if value="{{ e.isRm }}" hint-placeholder-val="{{ false }}">
<button type="button" class="lf-tile lf-box" onClick="{{ e.open }}" aria-label="{{ e.aria }}" style="grid-column: {{ e.span }}; display: flex; flex-direction: column; align-items: stretch; gap: 10px; border: 0; cursor: pointer; font: inherit; letter-spacing: inherit; color: inherit; text-align: left">
<span class="lf-wipe" style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(31, 31, 31, 0.08); overflow: hidden; pointer-events: none">
<dc-import name="ReadMore" preview="{{ true }}" hint-size="100%,340px"></dc-import>
</span>
<span style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px">
<span class="lf-cap" style="color: #1F1F1F">{{ e.num }}&nbsp;&nbsp;{{ e.title }}</span>
<span style="font-size: 15px; line-height: 22px; color: #6E6A66">{{ e.cat }}</span>
</span>
</button>
</sc-if>
<sc-if value="{{ e.isLd }}" hint-placeholder-val="{{ false }}">
<button type="button" class="lf-tile lf-box" onClick="{{ e.open }}" aria-label="{{ e.aria }}" style="grid-column: {{ e.span }}; display: flex; flex-direction: column; align-items: stretch; gap: 10px; border: 0; cursor: pointer; font: inherit; letter-spacing: inherit; color: inherit; text-align: left">
<span class="lf-wipe" style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(31, 31, 31, 0.08); overflow: hidden; pointer-events: none">
<dc-import name="Loader" preview="{{ true }}" hint-size="100%,300px"></dc-import>
</span>
<span style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px">
<span class="lf-cap" style="color: #1F1F1F">{{ e.num }}&nbsp;&nbsp;{{ e.title }}</span>
<span style="font-size: 15px; line-height: 22px; color: #6E6A66">{{ e.cat }}</span>
</span>
</button>
</sc-if>
<sc-if value="{{ e.isNav }}" hint-placeholder-val="{{ false }}">
<button type="button" class="lf-tile lf-box" onClick="{{ e.open }}" aria-label="{{ e.aria }}" style="grid-column: {{ e.span }}; display: flex; flex-direction: column; align-items: stretch; gap: 10px; border: 0; cursor: pointer; font: inherit; letter-spacing: inherit; color: inherit; text-align: left">
<span class="lf-wipe" style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(31, 31, 31, 0.08); overflow: hidden; pointer-events: none">
<dc-import name="NavBar" preview="{{ true }}" hint-size="100%,460px"></dc-import>
</span>
<span style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px">
<span class="lf-cap" style="color: #1F1F1F">{{ e.num }}&nbsp;&nbsp;{{ e.title }}</span>
<span style="font-size: 15px; line-height: 22px; color: #6E6A66">{{ e.cat }}</span>
</span>
</button>
</sc-if>
<sc-if value="{{ e.plainTile }}" hint-placeholder-val="{{ true }}">
<button type="button" class="lf-tile lf-box" onClick="{{ e.open }}" aria-label="{{ e.aria }}" style="grid-column: {{ e.span }}; display: flex; flex-direction: column; align-items: stretch; gap: 10px; border: 0; cursor: pointer; font: inherit; letter-spacing: inherit; color: inherit; text-align: left">
<sc-if value="{{ e.hasImg }}" hint-placeholder-val="{{ true }}">
<span class="lf-wipe" style="display: block; overflow: hidden; border-radius: 8px; background: #F3F3F1">
<img src="{{ e.img }}" alt="{{ e.alt }}" style="display: block; width: 100%; height: auto; aspect-ratio: {{ e.ratio }}; object-fit: cover">
</span>
</sc-if>
<sc-if value="{{ e.isLive }}" hint-placeholder-val="{{ false }}">
<span class="lf-wipe" style="box-sizing: border-box; flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; overflow: hidden; border-radius: 8px; background: linear-gradient(180deg, #FFFFFF 0%, #F8F9F9 100%); border: 1px solid rgba(31, 31, 31, 0.08); padding: 18px 20px; font-size: 15px; line-height: 1.55; color: #1F1F1F">
<span style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 17px; color: #6E6A66"><span>Keyboard access · run 2</span><span>3 of 4 verified</span></span>
<span style="align-self: flex-end; max-width: 80%; padding: 9px 14px; border-radius: 16px 16px 4px 16px; background: rgba(31, 31, 31, 0.05); color: #1F1F1F">Is the sign-in flow keyboard accessible?</span>
<span style="display: block">The sign-in trigger is reachable by Tab and announces its label. The privacy dialog holds focus and returns it on close, <span style="filter: blur(1.5px); opacity: 0.62; color: #6E6A66">though the country selector may not return focus on Escape.</span> Nothing else blocked the flow.</span>
<span style="margin-top: auto; display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: 10px; background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(31, 31, 31, 0.06); box-shadow: 0 6px 18px rgba(31, 31, 31, 0.06); font-size: 13px; line-height: 19px; color: #1F1F1F"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: #3F6C9B"></span><span>Still soft: the agent skipped this step, so nothing backs it up yet.</span></span>
<span style="display: flex; gap: 16px; font-size: 13px; line-height: 17px; color: #6E6A66"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 2px; border-radius: 1px; background: #1F1F1F"></span>Verified</span><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 2px; border-radius: 1px; background: #B9B4AE; filter: blur(1px)"></span>Unverified, tap to see why</span></span>
</span>
</sc-if>
<sc-if value="{{ e.isBox }}" hint-placeholder-val="{{ false }}">
<span class="lf-wipe" style="display: block; overflow: hidden; border-radius: 8px; border: 1px solid rgba(31, 31, 31, 0.08); background: #F7FAFA">
<video src="/media/lab-box-loop.mp4" poster="/media/lab-box-poster.webp" autoplay="true" loop="true" muted="true" playsinline="true" preload="auto" aria-label="A pastel blind box with a star on the front, turning slowly" style="display: block; width: 100%; height: auto; aspect-ratio: {{ e.ratio }}; object-fit: cover; pointer-events: none"></video>
</span>
</sc-if>
<sc-if value="{{ e.noImg }}" hint-placeholder-val="{{ false }}">
<span class="lf-wipe" style="display: flex; align-items: center; justify-content: center; aspect-ratio: {{ e.ratio }}; border-radius: 8px; background: none; border: 1px dashed #D5D1CC; color: #6E6A66">[Capture]</span>
</sc-if>
<span style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px">
<span class="lf-cap" style="color: #1F1F1F">{{ e.num }}&nbsp;&nbsp;{{ e.title }}</span>
<span style="font-size: 15px; line-height: 22px; color: #6E6A66">{{ e.cat }}</span>
</span>
</button>
</sc-if>
</sc-for>
</div>
</section>

<section class="lf-rv" style="display: flex; flex-direction: column; gap: 10px; padding-top: 16px; animation-delay: 0.16s">


</section>

</main>


</div>

<div aria-hidden="true" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: 96px; pointer-events: none">
<div style="position: absolute; inset: 0; backdrop-filter: blur(1px); -webkit-backdrop-filter: blur(1px); mask-image: linear-gradient(to bottom, transparent 0%, #000 20%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 20%)"></div>
<div style="position: absolute; inset: 0; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); mask-image: linear-gradient(to bottom, transparent 14%, #000 38%); -webkit-mask-image: linear-gradient(to bottom, transparent 14%, #000 38%)"></div>
<div style="position: absolute; inset: 0; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); mask-image: linear-gradient(to bottom, transparent 30%, #000 58%); -webkit-mask-image: linear-gradient(to bottom, transparent 30%, #000 58%)"></div>
<div style="position: absolute; inset: 0; backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); mask-image: linear-gradient(to bottom, transparent 46%, #000 76%); -webkit-mask-image: linear-gradient(to bottom, transparent 46%, #000 76%)"></div>
<div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.46) 42%, rgba(255, 255, 255, 0.8) 100%)"></div>
</div>

<div data-ask-dock="1" style="position: fixed; left: 0; right: 0; bottom: 20px; z-index: 11; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(.23,1,.32,1)">
<div class="lf-dockrow" style="box-sizing: border-box; max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 80px); display: flex; justify-content: center; column-gap: 56px">
<div class="lf-dock-sp" style="flex: 0 0 152px"></div>
<div style="flex: 1 1 400px; min-width: 0; max-width: 700px; display: flex; justify-content: center">
<button type="button" data-ask="1" aria-haspopup="dialog" style="pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border: 0; background: none; cursor: pointer; font: inherit; font-size: 15px; line-height: 22px; letter-spacing: inherit; color: #3F6C9B">
<span style="border-bottom: 1px dotted #3F6C9B">Ask LLManey</span>
</button>
</div>
</div>
</div>


<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
<div class="lf-sheet" role="dialog" aria-modal="true" aria-label="{{ cur.title }}" style="position: fixed; inset: 0; z-index: 20; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5); transition: clip-path 0.7s cubic-bezier(0.32, 0.72, 0, 1); clip-path: {{ clip }}">
<div class="lf-scroll" style="height: 100%; overflow-y: auto">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; min-height: 100%; font-size: 16px; line-height: 24px">

<aside class="lf-side" style="top: 0; box-sizing: border-box; flex: 1 1 300px; max-width: 380px; padding: 20px clamp(20px, 2.4vw, 32px) 48px; display: flex; flex-direction: column; gap: 28px; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border-right: 1px solid rgba(31, 31, 31, 0.08)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<button type="button" class="lf-btn" aria-label="Close experiment" onClick="{{ close }}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.7); box-shadow: 0 6px 24px rgba(31, 31, 31, 0.16); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); color: #1F1F1F; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"></path></svg>
</button>
<div style="display: flex; gap: 8px">
<button type="button" class="lf-btn" aria-label="Previous experiment" onClick="{{ prev }}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.7); box-shadow: 0 6px 24px rgba(31, 31, 31, 0.16); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); color: #1F1F1F; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 7h-9M6 3.5L2.5 7 6 10.5"></path></svg>
</button>
<button type="button" class="lf-btn" aria-label="Next experiment" onClick="{{ next }}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.7); box-shadow: 0 6px 24px rgba(31, 31, 31, 0.16); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); color: #1F1F1F; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7h9M8 3.5L11.5 7 8 10.5"></path></svg>
</button>
</div>
</div>

<div class="lf-rv" style="display: flex; flex-direction: column; gap: 10px; animation-delay: 0.3s">
<div style="font-size: 15px; line-height: 22px; color: #6E6A66">Lab · {{ cur.num }} of {{ total }}</div>
<h2 style="margin: 0; font-weight: 500; font-size: 16px; line-height: 1.5; color: #1F1F1F">{{ cur.title }}</h2>
<p style="margin: 0; color: #6E6A66">{{ cur.long }}</p>
</div>

<div class="lf-rv" style="display: flex; flex-direction: column; animation-delay: 0.38s">
<sc-for list="{{ cur.rows }}" as="r" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 13px 0; border-top: 1px solid #E9E6E2">
<div style="flex: none; color: #6E6A66">{{ r.k }}</div>
<div style="color: #1F1F1F; text-align: right">{{ r.v }}</div>
</div>
</sc-for>
</div>
</aside>

<div style="box-sizing: border-box; flex: 999 1 420px; min-width: 0; align-self: stretch; display: flex; align-items: center; justify-content: center; padding: clamp(20px, 3.5vw, 56px); background: rgba(247, 247, 246, 0.35)">
<sc-if value="{{ cur.hasImg }}" hint-placeholder-val="{{ true }}">
<img class="lf-rv" src="{{ cur.img }}" alt="{{ cur.alt }}" style="display: block; width: 581px; max-width: 920px; height: 533px; border-radius: 10px; box-shadow: 0 24px 64px rgba(31, 31, 31, 0.16); animation-delay: 0.25s">
</sc-if>
<sc-if value="{{ cur.isLive }}" hint-placeholder-val="{{ false }}">
<div class="lf-rv" style="width: 100%; max-width: 640px; animation-delay: 0.25s">
<dc-import name="Confidence" hint-size="100%,320px"></dc-import>
</div>
</sc-if>
<sc-if value="{{ cur.isRm }}" hint-placeholder-val="{{ false }}">
<div class="lf-rv" style="width: 100%; max-width: 640px; animation-delay: 0.25s">
<dc-import name="ReadMore" hint-size="100%,320px"></dc-import>
</div>
</sc-if>
<sc-if value="{{ cur.isLd }}" hint-placeholder-val="{{ false }}">
<div class="lf-rv" style="width: 100%; max-width: 640px; animation-delay: 0.25s">
<dc-import name="Loader" hint-size="100%,300px"></dc-import>
</div>
</sc-if>
<sc-if value="{{ cur.isNav }}" hint-placeholder-val="{{ false }}">
<div class="lf-rv" style="width: 100%; max-width: 640px; animation-delay: 0.25s">
<dc-import name="NavBar" hint-size="100%,600px"></dc-import>
</div>
</sc-if>
<sc-if value="{{ cur.isBox }}" hint-placeholder-val="{{ false }}">
<div class="lf-rv" style="width: 100%; max-width: 640px; animation-delay: 0.25s">
<dc-import name="BlindBox" hint-size="100%,500px"></dc-import>
</div>
</sc-if>
<sc-if value="{{ cur.noImg }}" hint-placeholder-val="{{ false }}">
<div style="width: 100%; max-width: 920px; aspect-ratio: 3 / 2; border-radius: 10px; border: 1px dashed #B9B4AE; display: flex; align-items: center; justify-content: center; color: #6E6A66">[Prototype or recording]</div>
</sc-if>
</div>

</div>
</div>
</div>
</sc-if>

<dc-import name="AskLLManey" start-open="{{ false }}" hint-size="0px,0px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var st = this.state || {};
var open = typeof st.open === 'number' ? st.open : -1;
var FULL = 'inset(0px 0px 0px 0px round 0px)';
var DATA = [
{
title: 'Read more, read less', cat: 'Interaction',
desc: 'A long synopsis collapses behind a progressive blur instead of a hard cut.',
long: 'A film synopsis collapses behind a progressive blur rather than a hard cut, so the text dissolves instead of stopping mid-sentence. Expanding and collapsing share one easing curve, so the block grows and settles rather than snapping, and the control swaps between Read more and Show less in place so nothing jumps under the cursor.',
img: '', alt: '', live: 'rm',
rows: [
{ k: 'Type', v: 'Micro-interaction' },
{ k: 'Pattern', v: 'Progressive disclosure' },
{ k: 'Motion', v: 'Blur to clear, eased expand' },
{ k: 'Surface', v: 'Film synopsis' },
{ k: 'Built with', v: 'Live prototype' },
{ k: 'Status', v: 'Working' },
{ k: 'Year', v: '2026' }
],
span: 'span 1', ratio: '820 / 752'
},
{
title: 'Shape-shifting loader', cat: 'Motion \u00b7 Interaction',
desc: 'One soft shape morphs through a circle, square, triangle and star while you wait.',
long: 'A loader with no text to read. One soft shape morphs from a circle into a square, a triangle and a star, with a small squash and stretch each time it lands, so waiting feels like watching something rather than staring at a spinner. Simulate a load and it reports real progress in plain words, then settles on the star when it\u2019s ready.',
img: '', alt: '', live: 'ld',
rows: [
{ k: 'Type', v: 'Loading state' },
{ k: 'Pattern', v: 'Shape morph' },
{ k: 'Motion', v: 'Morph, squash and stretch' },
{ k: 'Input', v: 'Tap to simulate a load' },
{ k: 'Built with', v: 'Live prototype' },
{ k: 'Status', v: 'Working' },
{ k: 'Year', v: '2026' }
],
span: 'span 1', ratio: '3 / 2'
},
{
title: 'Blind box', cat: 'Delight \u00b7 Interaction',
desc: 'Open the box, tear the bag, meet whoever is inside.',
long: 'A blind box, rebuilt as a micro-interaction. The box turns slowly in 3D; tap it and the lid swings open on its hinge, the box drops away and a foil pouch rises out of it. Slide along the dotted line to tear it and the top peels off, the pouch falls, and a star spins out with a burst of confetti. Which colourway you get is random every time, with a one-in-twelve chance of the secret Aurora Star, and a running collection count gives a reason to open another. The tear follows your finger, so the reveal feels earned rather than played at you.',
img: '', alt: '', live: 'box',
rows: [
{ k: 'Type', v: 'Micro-interaction' },
{ k: 'Pattern', v: 'Variable reward' },
{ k: 'Motion', v: '3D hinge, tear, spin reveal' },
{ k: 'Input', v: 'Tap, then slide' },
{ k: 'Built with', v: 'Live prototype' },
{ k: 'Status', v: 'Working' },
{ k: 'Year', v: '2026' }
],
span: 'span 2', ratio: '21 / 9'
},
{
title: 'Quick-add tab bar', cat: 'Mobile \u00b7 Navigation',
desc: 'A mobile tab bar whose centre button opens a stack of quick actions.',
long: 'A mobile tab bar with Home and Files on either side of a raised add button. Tap the button and it turns into a close mark while three quick actions spring up above it, staggered so the eye follows them up; the page behind softens so the choice is the only thing in focus. Pick one and the stack folds away with a small confirmation, or tap anywhere to back out.',
img: '', alt: '', live: 'nav',
rows: [
{ k: 'Type', v: 'Navigation pattern' },
{ k: 'Pattern', v: 'Tab bar with quick actions' },
{ k: 'Motion', v: 'Staggered spring, rotate to close' },
{ k: 'Input', v: 'Tap' },
{ k: 'Built with', v: 'Live prototype' },
{ k: 'Status', v: 'Working' },
{ k: 'Year', v: '2026' }
],
span: 'span 2', ratio: '21 / 9'
}
];
var n = DATA.length;
function rectClip(el) {
var r = el.getBoundingClientRect();
var w = window.innerWidth, h = window.innerHeight;
return 'inset(' + Math.max(r.top, 0) + 'px ' + Math.max(w - r.right, 0) + 'px ' + Math.max(h - r.bottom, 0) + 'px ' + Math.max(r.left, 0) + 'px round 6px)';
}
var experiments = DATA.map(function (d, i) {
return Object.assign({}, d, {
num: ('0' + (i + 1)).slice(-2),
span: d.span || 'span 1',
ratio: d.ratio || '3 / 2',
hasImg: !!d.img,
isLive: d.live === true,
isBox: d.live === 'box',
isRm: d.live === 'rm',
isLd: d.live === 'ld',
isNav: d.live === 'nav',
plainTile: d.live !== 'rm' && d.live !== 'ld' && d.live !== 'nav',
noImg: !d.img && !d.live,
aria: 'Open ' + d.title,
open: function (e) {
var frame = e.currentTarget.querySelector('img') || e.currentTarget.querySelector('span') || e.currentTarget;
var from = rectClip(frame);
self.setState({ open: i, from: from, clip: from });
requestAnimationFrame(function () { requestAnimationFrame(function () { self.setState({ clip: FULL }); }); });
}
});
});
return {
experiments: experiments,
total: ('0' + n).slice(-2),
isOpen: open >= 0,
cur: experiments[open >= 0 ? open : 0],
clip: st.clip || FULL,
close: function () {
self.setState({ clip: st.from || 'inset(50% 50% 50% 50% round 6px)' });
setTimeout(function () { self.setState({ open: -1 }); }, 700);
},
prev: function () { self.setState({ open: (open - 1 + n) % n, clip: FULL }); },
next: function () { self.setState({ open: (open + 1) % n, clip: FULL }); }
};
}
}
</script>
